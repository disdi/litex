# Official RISC-V debug (DebugModule + tunneled DTM) on a REAL Digilent Arty A7.
#
# Build the gateware first:
#   cd linux-on-litex-vexriscv
#   ./make.py --board=arty --cpu-count=1 --with-privileged-debug --build --load
# then:
#   openocd -f litex/litex/tools/debug/openocd_arty_official.cfg
#
# Hardware counterpart of openocd_sim_official.cfg. Same tunnel TCL, different
# bottom half: the on-board FT2232 + Xilinx xc7.tap replace jtagremote's
# remote_bitbang + the sim's dedicated CPU TAP.
#
# The DTM sits behind Xilinx BSCANE2 USER4 (IR 0x23) on xc7.tap (irlen 6).
# riscv.c defaults the tunnel IR to 0x23 << (irlen - 6) when set_bscan_tunnel_ir
# is not called, so USER4 is reached without extra configuration.

set _here [file dirname [info script]]
source [file join $_here openocd_arty_bscan.cfg]
source [file join $_here riscv_jtag_tunneled.tcl]
