# Official RISC-V debug (DebugModule + tunneled DTM) over JTAG in litex_sim.
#
# Sources its two halves relative to this file, so the whole directory can be
# moved or used from any working directory.

set _here [file dirname [info script]]
source [file join $_here openocd_jtag_remote.cfg]
source [file join $_here riscv_jtag_tunneled.tcl]
