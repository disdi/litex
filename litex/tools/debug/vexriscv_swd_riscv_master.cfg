# RISC-V target over SWD, through the VexRiscv DMI gateway AP -- OpenOCD MASTER path.
#
# This is the long-term replacement for vexriscv_swd_riscv.cfg (which needs the
# patched Raspberry Pi fork). It runs on ~/openocd-master, branch vexriscv-gateway:
#   * Gerrit 9786 "target/riscv: add DTM abstraction and AP backend", which lets a
#     riscv target reach DMI through a DAP instead of a JTAG TAP, and
#   * a second DMI backend (src/target/riscv/dtm/vexriscv_gateway.c) implementing the
#     Phase 2C DMI_ADDR/DMI_DATA gateway map, selected by `-type vexriscv-gateway`.
#
# Rationale and the plan this implements: SWD.md section 6.4.2.
#
# Source AFTER openocd_swd_remote.cfg (adapter/transport) and vexriscv_swd.cfg
# (which creates the DAP).
#
#   make SWD_SIM=1 soc_sim_swd_run            # terminal 1
#   make openocd-sim-swd-riscv-master         # terminal 2
#
# ap-num 0: SELECT.APSEL is not decoded by the gateway (single-AP design).
#
# The DTM owns the AP and therefore DMI_ADDR, which is shared by every hart on the
# DM behind it -- that is why the flavour is a property of the DTM, not the target.
# `-type ap` here instead would be a CoreSight Mem-AP and would silently read AP_IDR
# as dmcontrol; the backend refuses that at bind time by checking AP_IDR.

dtm create vexriscv.dtm -type vexriscv-gateway -dap vexriscv.dap -ap-num 0

# Uncomment once the placeholder AP_IDR is replaced (Phase2D.md 2.1). The default
# built into the backend is 0x74726976.
# vexriscv.dtm configure -gateway-ap-idr 0x74726976

target create vexriscv.rv riscv -dtm vexriscv.dtm

# SWD in sim advances one SWCLK step per 10 sys clocks, so every DMI access is
# slow; give GDB and OpenOCD room before they declare a timeout.
riscv set_command_timeout_sec 120

# Halt on GDB attach. Without this, GDB connects to a running target and its
# run-state goes stale: `monitor halt` stops the CPU but GDB still believes it is
# running, so `stepi`/`continue` fail with
#   "Cannot execute this command while the target is running."
vexriscv.rv configure -event gdb-attach halt
