# VexRiscv SW-DP + DMI gateway AP.
#
# AP register map (A[3:2], i.e. the byte offsets used by "dap apreg"):
#   0x00  AP_IDR       RO id, marks a RISC-V DMI gateway (not a MEM-AP)
#   0x04  DMI_ADDR     7-bit DMI word address
#   0x08  DMI_DATA     DMI read/write at DMI_ADDR
#   0x0c  POSTED_READ  last DMI read result (RDBUFF-style)
#
# DPIDR / AP_IDR below are still random. They must not look like an
# ARM Cortex SW-DP (designer 0x23B / 0x2ba01477); replace with a real JEP106 designer +
# part number before this is used elsewhere.
set VEXRISCV_SWD_DPIDR  0x0ba11aab
set VEXRISCV_SWD_AP_IDR 0x74726976

swd newdap vexriscv cpu -expected-id $VEXRISCV_SWD_DPIDR
dap create vexriscv.dap -chain-position vexriscv.cpu

# --- DMI access over the gateway AP ------------------------------------------------------
# "dap apreg" already performs the ADI posted-read handshake, so a DMI_DATA read returns the
# value rather than the previous one; POSTED_READ re-reads the same buffer.

proc vexriscv_dmi_read {addr} {
	vexriscv.dap apreg 0 0x04 $addr
	return [vexriscv.dap apreg 0 0x08]
}

proc vexriscv_dmi_write {addr value} {
	vexriscv.dap apreg 0 0x04 $addr
	vexriscv.dap apreg 0 0x08 $value
}

proc vexriscv_swd_smoke {} {
	global VEXRISCV_SWD_AP_IDR
	set idr [vexriscv.dap apreg 0 0x00]
	if {$idr != $VEXRISCV_SWD_AP_IDR} {
		error [format "AP_IDR mismatch: got 0x%08x, expected 0x%08x" $idr $VEXRISCV_SWD_AP_IDR]
	}
	set dmstatus [vexriscv_dmi_read 0x11]
	set version       [expr {$dmstatus & 0xf}]
	set authenticated [expr {($dmstatus >> 7) & 1}]
	echo [format "AP_IDR   = 0x%08x" $idr]
	echo [format "dmstatus = 0x%08x (version=%d authenticated=%d allrunning=%d allhalted=%d)" \
		$dmstatus $version $authenticated \
		[expr {($dmstatus >> 11) & 1}] [expr {($dmstatus >> 9) & 1}]]
	if {$version != 2 || $authenticated != 1} {
		error "dmstatus does not look like an authenticated 0.13/1.0 Debug Module"
	}
	echo "PASS: SWD -> SW-DP -> DMI gateway -> DebugModule"
}
