# SWD transport on a REAL Digilent Arty A7, via a CMSIS-DAP probe.
#
# Hardware sibling of openocd_swd_remote.cfg: same DAP/DMI helpers, different adapter half.
# The sim lane bit-bangs SWD over remote_bitbang to litex_sim's "swdremote" module; here a
# CMSIS-DAP probe drives the wires directly.
#
# Pinout (Step5.md W1 / Arty.md 5.2):  SWCLK = JB3 (D15)  SWDIO = JB4 (C15)  GND = JB5
# Probe: Raspberry Pi Debug Probe, VID:PID 2e8a:000c, CMSIS-DAP v2 (USB bulk).
#
# Build the gateware first:
#   cd linux-on-litex-vexriscv
#   ./make.py --board=arty --cpu-count=1 --with-swd-debug --build --load
#
# Then:
#   ~/openocd-master/src/openocd -s ~/openocd-master/tcl \
#       -f litex/litex/tools/debug/openocd_arty_swd.cfg \
#       -f litex/litex/tools/debug/vexriscv_swd.cfg \
#       -c "init" -c "vexriscv_swd_smoke" -c "exit"
#
# Requires OpenOCD master for the riscv-over-DAP work later; the raw `dap apreg` smoke
# above runs on stock master as-is.

adapter driver cmsis-dap
cmsis-dap backend usb_bulk
transport select swd

# Start slow. Ramp to 1000 / 4000 only after DPIDR reads cleanly -- these are flying leads.
adapter speed 100
