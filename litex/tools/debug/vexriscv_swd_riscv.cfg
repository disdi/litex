# RISC-V target over SWD, through the VexRiscv DMI gateway AP.
#
# Source AFTER openocd_swd_remote.cfg (adapter/transport) and vexriscv_swd.cfg
# (which creates the DAP). Adds the `riscv` target so OpenOCD examines the hart
# and serves GDB, rather than only doing raw `dap apreg` accesses.

target create vexriscv.rv riscv -dap vexriscv.dap -ap-num 0

vexriscv.rv riscv set_dmi_ap_flavour vexriscv-gateway

riscv set_command_timeout_sec 120

vexriscv.rv configure -event gdb-attach halt
