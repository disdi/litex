# Digilent Arty A7 — onboard FT2232 JTAG (program + debug via Xilinx TAP + tunnel)

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
ftdi tdo_sample_edge falling
reset_config none
adapter speed 5000

source [find cpld/xilinx-xc7.cfg]
source [find cpld/jtagspi.cfg]

# CPU debug reaches tunneled DTM through FPGA USER4 (IR 0x23)
set TAP_NAME xc7.tap