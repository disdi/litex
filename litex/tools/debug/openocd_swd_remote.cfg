# SWD over remote_bitbang to the litex_sim "swdremote" module (TCP 44854).
#
# Requires OpenOCD master (0.12.0+dev): the SWD extensions to the remote_bitbang driver
# ('O'/'o'/'c'/'d'-'g').

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 44854

transport select swd

adapter speed 100
